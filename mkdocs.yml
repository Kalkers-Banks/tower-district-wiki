site_name: Tower District Wiki
site_description: The community-maintained Tower District wiki
site_url: https://kalkers-banks.github.io/tower-district-wiki/

repo_url: https://github.com/Kalkers-Banks/tower-district-wiki
repo_name: Kalkers-Banks/tower-district-wiki

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Towers: towers/index.md
  - Builders: builders/index.md
  - Guides: guides/index.md
  - About: about.md
